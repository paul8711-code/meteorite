name: Rust Checks

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      important: ${{ steps.filter.outputs.important }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            important:
              - "**/src/**"
              - "**/tests/**"
              - "**/Cargo.toml"
              - ".cargo/**"
              - "Cargo.*"

  checks:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.important == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Checks (Linux)
            os: ubuntu-latest

          - name: Checks (macOS)
            os: macos-latest

          - name: Checks (Windows)
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.1

      - name: Prexec (Environment Setup)
        run: |
          case "${{ matrix.os }}" in
            *'windows'*)
              echo "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl" | tee -a "$GITHUB_ENV"
              ;;
          esac
          case "${{ matrix.os }}" in
            *'ubuntu'*)
              sudo apt-get update
              sudo apt-get install -y pkg-config libglib2.0-dev libgtk-3-dev
              ;;
          esac
          cargo update

      - name: Formatting Check
        run: cargo fmt --all --check

      - name: Clippy Check
        run: cargo clippy --all-targets --all-features --workspace -- -D warnings

      - name: Run Tests
        run: cargo test --all-features --workspace

  required-checks:
    name: Required Status Checks
    needs: [changes, checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.changes.outputs.important }}" = "true" ]; then
            if [ "${{ needs.checks.result }}" != "success" ]; then
              echo "Rust checks failed"
              exit 1
            fi
          fi
          echo "Checks passed or skipped"
